services:
  - type: web
    name: ai-assistant
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/app.py
    envVars:
      - key: OLLAMA_URL
        value: http://localhost:11434/api/generate
      - key: AI_MODEL
        value: llama3.2
      - key: AI_MAX_TOKENS
        value: "150"
      - key: PORT
        value: "8000"
