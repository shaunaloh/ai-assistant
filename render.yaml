services:
  - type: web
    name: ai-assistant
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/app.py
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_MODEL
        value: gemini-2.0-flash
      - key: AI_MAX_TOKENS
        value: "250"
