<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Shauna's AI Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

</head>
<body>

<div class="container">
    <h1>Shauna's AI Assistant</h1>

    <div class="chat-box">
        {% if not messages %}
        <div class="message bot welcome">
            <div class="avatar">🤖</div>
            <div class="bubble">If you have any questions, I'm here to help!</div>
        </div>
        {% endif %}
        {% for m in messages %}
        <div class="message user">
            <div class="avatar">🙂</div>
            <div class="bubble">{{ m.user_input }}</div>
        </div>
        <div class="message bot">
            <div class="avatar">🤖</div>
            <div class="bubble">{{ m.bot_response }}</div>
        </div>
        {% endfor %}
    </div>

    <form method="POST" action="/chat">
        <textarea name="prompt" placeholder="Type your message…" required></textarea>
        <button type="submit">Send</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
</div>

</body>
</html>

<script>
// AJAX submit to avoid full page reload and prevent double sends
const form = document.querySelector('form');
const textarea = document.querySelector('textarea[name="prompt"]');
const button = document.querySelector('button[type="submit"]');
const chatBox = document.querySelector('.chat-box');

function renderMessages(messages) {
    chatBox.innerHTML = messages.map(m => {
            const user = `
                <div class="message user">
                    <div class="avatar">🙂</div>
                    <div class="bubble">${escapeHtml(m.user_input)}</div>
                </div>`;
            const bot = `
                <div class="message bot">
                    <div class="avatar">🤖</div>
                    <div class="bubble">${escapeHtml(m.bot_response)}</div>
                </div>`;
        return user + bot;
    }).join('\n');
    chatBox.scrollTop = chatBox.scrollHeight;
}

function escapeHtml(unsafe) {
    if (unsafe == null) return '';
    return unsafe
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const prompt = textarea.value.trim();
    if (!prompt) return;

    button.disabled = true;
    const oldText = button.textContent;
    button.textContent = 'Sending...';

    const start = performance.now();
    try {
        const resp = await fetch(form.action, {
            method: 'POST',
            headers: {
                'X-Requested-With': 'XMLHttpRequest',
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: new URLSearchParams({ prompt })
        });

        const data = await resp.json();
        if (data.error) {
            // show error below form
            let errEl = document.querySelector('.error');
            if (!errEl) {
                errEl = document.createElement('p');
                errEl.className = 'error';
                form.after(errEl);
            }
            errEl.textContent = data.error;
        } else {
            renderMessages(data.messages);
            textarea.value = '';
            const elapsed = ((performance.now() - start) / 1000).toFixed(2);
            console.log('LLM roundtrip (client):', elapsed + 's');
        }
    } catch (err) {
        console.error('Request failed', err);
        let errEl = document.querySelector('.error');
        if (!errEl) {
            errEl = document.createElement('p');
            errEl.className = 'error';
            form.after(errEl);
        }
        errEl.textContent = 'Network or server error. See console.';
    } finally {
        button.disabled = false;
        button.textContent = oldText;
    }
});
</script>
